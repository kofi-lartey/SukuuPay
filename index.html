<!DOCTYPE html>
<html lang="en">
  <head>
    <!--
      MUST be the first thing in <head>, within the first 1024 bytes.

      This was missing entirely, and it is why the title below rendered as three odd
      characters instead of an em dash in the browser tab. The file was always valid
      UTF-8; with no declaration the browser *guesses* an encoding, and for a document
      served from a CDN that guess frequently lands on windows-1252. An em dash is three
      UTF-8 bytes, and windows-1252 assigns each of those bytes a printable character of
      its own, so one character became three.

      (The three characters are deliberately not written out here. `scripts/
      find-non-ascii.mjs` scans for exactly that sequence, and reproducing it in a file
      meant the repair tool kept "fixing" this comment — a comment whose entire job was
      to describe the corruption.)

      The position is load-bearing, not stylistic. A browser that has already parsed past
      1024 bytes, or already decoded a chunk of the document, will not re-read a charset
      declared later. So it goes above the verification meta tag, above the icons, above
      everything.

      `netlify.toml` additionally sends `X-Content-Type-Options: nosniff` with no charset
      on the Content-Type header. That combination makes the *header* authoritative, so
      the charset is declared there too — the two must agree, and both are needed: the
      header covers the initial navigation, the meta tag covers anything that arrives
      without one.
    -->
    <meta charset="utf-8" />
    <meta name="google-site-verification" content="G46K2VQ2grOVK34kpkNy-FxOPP-G2wrfpc5zUHd1PGM" />
    <!-- iOS ignores SVG for the home screen and Android reads the manifest, so both
      are needed for the app to have an icon on a phone. 256 (not 120) is the
      apple-touch-icon because iOS renders at 180 and scales down. Colours are
      brand-700, per tailwind.config.js. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="120x120" href="/sukuupay-logo-120.png" />
    <link rel="apple-touch-icon" href="/sukuupay-logo.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="SukuuPay is Ghana's #1 school fee and mobile money collection platform. Collect fees via MTN MoMo, Telecel Cash and AT Money with automatic receipts, SMS reminders and flexible installment plans."
    />
    <meta name="theme-color" content="#0F5132" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>SukuuPay — Collect Every School Fee, Every Term</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
