# Netlify build + SPA routing for the SukuuPay frontend.
#
# This file lives in `frontend/`, alongside the package.json Netlify builds.
# Netlify only reads a netlify.toml at the ROOT of the base directory it was
# configured with — and the site is already deploying with its base directory
# set to `frontend`, because there is no package.json at the repo root. A copy
# at the repo root is silently ignored, which is what left every deep link 404ing
# on the first deploy. Change the base directory in the Netlify UI to "."
# if you ever want this file to live one level up instead.
#
# The app uses `BrowserRouter`, so the URL path is owned by React Router rather
# than by files on disk. Without the rewrite below, any request that isn't
# `/assets/*` or `/index.html` would be looked up on disk and 404 — breaking
# every deep link, the worst case being the onboarding wizard, whose steps are
# separate URLs (`/onboarding/school-profile`, `/onboarding/payment-setup`,
# `/onboarding/import-students`, `/onboarding/pricing`,
# `/onboarding/send-reminder`). A user who bookmarks a step or follows a shared
# link would land on a dead page.
#
# Verified against the live site before this file existed:
#   /reset-password/abc123 -> 404
#   /verify-email/abc123   -> 404
# Those are the two emailed callback routes, so a broken reset link locks a user
# out of their account rather than merely costing them a bookmark.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Vite runs `vite build` by default and emits to `dist/`, so no redirect is
# needed for the build itself — only for client-side routing below.
#
# `status = 200` rather than the legacy `200!`: Netlify serves the SPA shell
# and the browser resolves the route, so this is a rewrite, not a redirect.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Vite fingerprints these under /assets, and the catch-all above already sends
# unmatched paths to index.html. Explicitly passing the build output through
# keeps them immutable-cacheable for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The bundle is rebuilt whenever a source file changes, and the filenames are
# content-hashed, so index.html itself must never be cached — a stale one pins
# visitors to the previous deploy's JS and breaks the app after a release.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    # The SPA shell is the one response whose encoding has to be declared, because the
    # `nosniff` header below makes Content-Type authoritative and forbids the browser
    # from falling back to sniffing. Combined with a document whose <title> contains an
    # em dash, a shell served without `charset` renders that single character as three.
    #
    # This must agree with the `<meta charset="utf-8">` in `index.html`. The meta tag
    # covers a shell fetched without this header (a local build served by any other
    # host, or a cached copy); the header covers the case where the browser honours the
    # transport declaration first. Both are needed — either alone leaves a path through
    # where the guess happens, and the guess lands on windows-1252 often enough to be
    # seen.
    #
    # The mangled sequence itself is not written out here: `find-non-ascii.mjs` scans for
    # it, and a comment reproducing it gets flagged every run.
    Content-Type = "text/html; charset=utf-8"

# Security headers. The directives below are derived from what the app actually
# loads — an over-tight CSP here only fails in production, with a blank page
# and a console full of violations, so each entry is accounted for:
#   script-src 'self' https://accounts.google.com
#                          — the Vite bundle, plus Google Identity Services, which
#                            Sign-In With Google loads from
#                            https://accounts.google.com/gsi/client. Still no CDN
#                            and no inline script of our own: `dist/index.html`
#                            contains none, so `'unsafe-inline'` is deliberately
#                            absent and stays absent. Google's own documented CSP
#                            for GIS does not require it either.
#   frame-src https://accounts.google.com
#                          — **required, and easy to miss.** The Sign-In With Google
#                            button is not our DOM: `accounts.id.renderButton` draws
#                            it inside a cross-origin iframe. With only `script-src`
#                            opened, the script loads and the button silently never
#                            appears — the one failure mode where the CSP gives no
#                            error about the thing you were trying to fix.
#   connect-src + https://accounts.google.com
#                          — GIS calls its own token endpoint from the page. Also
#                            covers the `postMessage` round trip that returns the
#                            credential to the opener tab.
#   style-src + https://accounts.google.com
#                          — GIS fetches its own stylesheet from
#                            https://accounts.google.com/gsi/style. Without it the
#                            button iframe renders unstyled inside our page, which
#                            looks like a layout bug rather than a policy one.
#   script-src, the hash    — GIS executes an inline script of its own once loaded,
#                            and refuses to work without it. Adding the **hash** is
#                            deliberate and it is the whole reason `'unsafe-inline'`
#                            is still absent: a hash permits exactly one known
#                            script and nothing else, so our own inline code stays
#                            blocked.
#
#                            The cost is that the hash is pinned to the bytes Google
#                            currently serves. When Google updates `gsi/client` the
#                            hash stops matching and Sign-In With Google fails
#                            *visibly* — a CSP error in the console and no button —
#                            rather than silently. The fix is to copy the new hash
#                            out of the browser's error message, which names it.
#                            `'unsafe-inline'` would have avoided this and is the
#                            wrong trade: it re-opens inline execution for the whole
#                            app to accommodate a third party.
#
#   frame-src https://accounts.google.com
#                          — **required, and easy to miss.** The Sign-In With Google
#                            button is not our DOM: `accounts.id.renderButton` draws
#                            it inside a cross-origin iframe. With only `script-src`
#                            opened, the script loads and the button silently never
#                            appears — the one failure mode where the CSP gives no
#                            error about the thing you were trying to fix.
#   connect-src + https://accounts.google.com
#                          — GIS calls its own token endpoint from the page. Also
#                            covers the `postMessage` round trip that returns the
#                            credential to the opener tab.
#   style-src 'unsafe-inline' — required three times over: React sets inline
#                            `style` attributes (Step2/Step4 previews, Tailwind
#                            arbitrary values), index.html loads the Google Fonts
#                            stylesheet, and GIS styles its own iframe.
#   font-src               — Plus Jakarta Sans, served from fonts.gstatic.com.
#   img-src                — inline data: URLs, Unsplash photos on the
#                            marketing pages (Hero, PhoneMockup, HowItWorks),
#                            Cloudinary (school logos and receipts uploaded at
#                            runtime), and lh3.googleusercontent.com for a Google
#                            account's profile picture.
#
# **No `child-src`.** It is a legacy fallback for `frame-src` and browsers that
# support `frame-src` ignore it; adding both would be a second place to keep in
# sync for no gain.
#
# If Google Sign-In is ever removed, every Google entry here comes out together —
# they exist only for `src/utils/googleIdentity.js`.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # `microphone=(self)` rather than `microphone=()`.
    #
    # `()` denies the microphone outright, and the Parents Portal voice recorder calls
    # `navigator.mediaDevices.getUserMedia({ audio: true })` — so on the deployed site
    # `getUserMedia` was rejected by the browser before the page ever saw a permission
    # prompt, and the recorder rendered its "microphone access is blocked for this site"
    # branch. The feature passed locally because the Vite dev server sends no
    # Permissions-Policy at all, so the header was the only thing standing between the
    # recorder and production.
    #
    # `(self)` rather than `*`: the recording must not be capturable by a cross-origin
    # iframe embedded in the app. This is also the one directive here that exists to
    # *enable* something, so it is the one worth re-checking whenever a capture feature is
    # added or removed.
    #
    # `camera=()` stays denied: nothing in the product captures video. `geolocation=()`
    # stays denied for the same reason.
    Permissions-Policy = "camera=(), microphone=(self), geolocation=()"
    Content-Security-Policy = "default-src 'self'; connect-src 'self' https://sukuupay-backend.onrender.com https://accounts.google.com; img-src 'self' data: blob: https://images.unsplash.com https://res.cloudinary.com https://lh3.googleusercontent.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; font-src 'self' data: https://fonts.gstatic.com; script-src 'self' https://accounts.google.com 'sha256-mTJ4cJaTm2Gw95GeXEpZdvEEY9ybh6FZu1bwcNE7QlY='; frame-src 'self' https://accounts.google.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
